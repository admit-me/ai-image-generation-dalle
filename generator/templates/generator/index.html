<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Image Generator</title><style>body{font-family:Arial;max-width:850px;margin:40px auto;padding:20px}textarea{width:100%;height:120px;padding:12px}button{margin-top:12px;padding:12px 20px;cursor:pointer}img{max-width:100%;margin-top:20px;border-radius:10px}.error{color:#b00020}</style></head>
<body><h1>AI-Powered Image Generator</h1><p>Describe an image and generate it with OpenAI.</p><form method="post">{% csrf_token %}<textarea name="prompt" placeholder="A futuristic city at sunset...">{{ prompt }}</textarea><br><button type="submit">Generate Image</button></form>{% if error %}<p class="error">{{ error }}</p>{% endif %}{% if image_url %}<h2>Generated Image</h2><img src="{{ image_url }}" alt="Generated image"><p><a href="{{ image_url }}" download>Download image</a></p>{% endif %}</body>
</html>
